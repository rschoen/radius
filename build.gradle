// Top-level build file where you can add configuration options common to all sub-projects/modules.


buildscript {
    ext {
        version_core = "1.16.0"
        version_appcompat = "1.7.1"
        version_firebase = "33.1.1"
        version_firebaseui_auth = "9.1.1"
        version_material = "1.12.0"
        version_maps = "19.2.0"
        version_constraint_layout = "2.2.1"
        version_lifecycle = "2.9.1"
        version_navigation = '2.9.6'
        version_room = "2.7.1"
        version_retrofit= "3.0.0"
        version_moshi = "1.15.2"
        version_timber = "5.0.1"
        version_junit = "4.13.2"
        version_junit_ext = "1.1.5"
        version_espresso = "3.5.1"
        version_glide = '5.0.5'
        version_places = "4.3.1"
        version_okhttp = "5.3.2"
        version_work = "2.11.1"
        version_activity = "1.10.1"
        version_swiperefreshlayout = "1.2.0"
    }
    repositories {
        google()
    }
    dependencies {
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$version_navigation"
    }
}

plugins {
    id 'com.android.application' version '9.0.1' apply false
    id 'com.android.library' version '9.0.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin' version '2.0.1' apply false
    id 'com.google.devtools.ksp' version '2.3.2' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
