// Top-level build file where you can add configuration options common to all sub-projects/modules.


buildscript {
    ext {
        version_core = "1.19.0"
        version_appcompat = "1.8.0"
        version_firebase = "34.18.0"
        version_firebaseui_auth = "9.1.1"
        version_material = "1.14.0"
        version_maps = "20.0.0"
        version_constraint_layout = "2.2.2"
        version_lifecycle = "2.11.0"
        version_navigation = '2.10.0'
        version_room = "2.8.4"
        version_retrofit= "3.0.0"
        version_moshi = "1.15.2"
        version_timber = "5.0.1"
        version_junit = "4.13.2"
        version_junit_ext = "1.3.0"
        version_espresso = "3.7.0"
        version_glide = '5.0.9'
        version_places = "5.3.0"
        version_okhttp = "5.5.0"
        version_work = "2.11.2"
        version_activity = "1.13.0"
        version_swiperefreshlayout = "1.2.0"
    }
    repositories {
        google()
    }
    dependencies {
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$version_navigation"
    }
}

plugins {
    id 'com.android.application' version '9.4.0' apply false
    id 'com.android.library' version '9.4.0' apply false
    id 'com.android.legacy-kapt' version '9.4.0' apply false
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin' version '2.0.1' apply false
    id 'com.google.devtools.ksp' version '2.3.11' apply false
    id 'com.google.gms.google-services' version '4.5.0' apply false
}
